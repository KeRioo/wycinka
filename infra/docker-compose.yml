name: wycinka

services:
  db:
    # PostGIS 16 — primary parcels store (docs/data-schema.md — Postgres section).
    # SQLite (data/parcels.sqlite) stays as dev fallback when api has no WYCINKA_DB_URL.
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wycinka}
      POSTGRES_USER: ${POSTGRES_USER:-wycinka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VALIDATE-MISSING-POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wycinka} -d ${POSTGRES_DB:-wycinka}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # api zapytuje po wycinka-net; etl (loader) potrzebuje etl-net
    networks:
      - wycinka-net
      - etl-net

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: wycinka-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Układ wolumenu (pełni ETL): data/sqlite/parcels.sqlite + data/pmtiles/dzialki.pmtiles
      WYCINKA_DB_PATH: /app/data/sqlite/parcels.sqlite
      # PostGIS backend (priorytet gdy ustawiony — WYCINKA_DB_URL nadpisuje sqlite):
      WYCINKA_DB_URL: ${WYCINKA_DB_URL:-}
      WYCINKA_PMTILES_PATH: ${WYCINKA_PMTILES_PATH:-/app/data/pmtiles/dzialki.pmtiles}
      WYCINKA_SYNC_COMMAND: ${WYCINKA_SYNC_COMMAND:-python -m egib_sync --powiat ${ETL_POWIAT:-}}
    volumes:
      - api-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wycinka-net

  web:
    build:
      context: ../apps/web
      # Dockerfile w infra (kopia apps/web/Dockerfile): apps/web/.dockerignore
      # wyklucza nginx.conf zbudowanie własnego obiektu — patrz infra/web/Dockerfile
      # w REQUESTS.md.
      dockerfile: ../../infra/web/Dockerfile
      additional_contexts:
        infra: ../
      # Prod PWA działa same-origin (caddy + basic auth): relatywny API base.
      # Dev używa Vite dev serwa (VITE_API_URL w docker-compose.dev.yml).
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: wycinka-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wycinka-net

  caddy:
    # Stock caddy + entrypoint.sh z repo (rendering APP_ENV → snippety w Caddyfile).
    # Custom build z pluginem cloudflare-dns wróci przy wystawianiu do internetu
    # (auto-HTTPS z DNS challenge); dla LAN/LP/WLAN stock wystarczy.
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.sh", "run", "--config", "/tmp/Caddyfile.rendered", "--adapter", "caddyfile"]
    environment:
      DOMAIN: ${DOMAIN:-wycinka.app}
      APP_ENV: ${APP_ENV:-production}
      # CORS origin dla prod (dokładne dopasowanie). Dev (APP_ENV=development)
      # ignoruje tę wartość — fallback na "*".
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://${DOMAIN:-wycinka.app}}
      # bcrypt z `docker run --rm caddy:2-alpine caddy hash-password`;
      # wymagany w APP_ENV=production (bez niego logowanie zawsze 401) — patrz runbook.
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-VALIDATE-MISSING-AUTH_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - wycinka-net
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # po 127.0.0.1 — `localhost` w Alpine wpadnie w ::1, a admin nasłuchuje IPv4
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2024.5.0
    # Dwa tryby (wybór w runbook §secret):
    # A) token (zalecane, config ingress w CF dashboard/API):
    #    .env → CLOUDFLARED_TUNNEL_TOKEN=eyJ... ; stepni uruchamia ręcznie z tego tokena
    # B) plik(config.yml + credentials <tunnel_id>.json):
    #    cp cloudflared/config.yml.example cloudflared/config.yml + podmień <TUNNEL_ID>
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    networks:
      - wycinka-net
    depends_on:
      caddy:
        condition: service_healthy

  etl:
    build:
      context: ../scripts/sync-egib
      dockerfile: ../../infra/etl/Dockerfile
    image: wycinka-etl:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: etluser
    environment:
      EGIB_DATA_DIR: /app/data
      EGIB_LOG_JSON: "true"
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-86400}
      ETL_REPORT_KEEP: ${ETL_REPORT_KEEP:-5}
      EGIB_DOWNLOAD__MAX_RETRIES: ${EGIB_DOWNLOAD_RETRIES:-3}
      # PostGIS loader (kraj): stawiane w memory, needs db endpoint — do it via wycinka-net
      WYCINKA_PG_DSN: ${WYCINKA_PG_DSN:-}
    volumes:
      - api-data:/app/data
      - ./etl/run-sync.sh:/usr/local/bin/run-sync.sh:ro
      - ./etl/scheduler.sh:/usr/local/bin/scheduler.sh:ro
      - ./etl/etl-healthcheck.sh:/usr/local/bin/etl-healthcheck.sh:ro
    command: ["/bin/bash", "/usr/local/bin/scheduler.sh"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "bash /usr/local/bin/etl-healthcheck.sh"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - etl-net
    depends_on:
      db:
        condition: service_healthy

volumes:
  api-data:
  caddy-data:
  caddy-config:
  postgres-data:

networks:
  wycinka-net:
    driver: bridge
  etl-net:
    driver: bridge