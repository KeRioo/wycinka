name: wycinka

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: wycinka-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WYCINKA_SYNC_COMMAND: ${WYCINKA_SYNC_COMMAND:-python -m egib_sync --powiat ${ETL_POWIAT:-}}
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wycinka-net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: wycinka-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wycinka-net

  caddy:
    build: ./caddy
    image: wycinka-caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - wycinka-net
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2024.5.0
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    networks:
      - wycinka-net
    depends_on:
      caddy:
        condition: service_healthy

  etl:
    build:
      context: ../scripts/sync-egib
      dockerfile: ../../infra/etl/Dockerfile
    image: wycinka-etl:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: etluser
    environment:
      EGIB_DATA_DIR: /app/data
      EGIB_LOG_JSON: "true"
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-86400}
      ETL_REPORT_KEEP: ${ETL_REPORT_KEEP:-5}
      EGIB_DOWNLOAD__MAX_RETRIES: ${EGIB_DOWNLOAD_RETRIES:-3}
    volumes:
      - api-data:/app/data
      - ./etl/run-sync.sh:/usr/local/bin/run-sync.sh:ro
      - ./etl/scheduler.sh:/usr/local/bin/scheduler.sh:ro
      - ./etl/etl-healthcheck.sh:/usr/local/bin/etl-healthcheck.sh:ro
    command: ["/bin/bash", "/usr/local/bin/scheduler.sh"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "bash /usr/local/bin/etl-healthcheck.sh"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - etl-net

volumes:
  api-data:
  caddy-data:
  caddy-config:

networks:
  wycinka-net:
    driver: bridge
  etl-net:
    driver: bridge