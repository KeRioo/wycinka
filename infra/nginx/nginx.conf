# Nginx — alternatywa dla Caddy
#
# Caddy jest domyślnym reverse-proxy w docker-compose.yml (auto-HTTPS,
# prostsza konfiguracja). Ten plik jest alternatywą dla zespołów, które
# wolą Nginx (np. gdy już mają istniejącą infrastrukturę Nginx).
#
# Aby użyć zamiast Caddy:
#   1. Podmień sekcję `caddy` w docker-compose.yml na:
#        nginx:
#          build: ./nginx
#          ...
#   2. Zamontuj ten plik jako /etc/nginx/nginx.conf

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 4096;
	multi_accept on;
	use epoll;
}

http {
	# --- podstawowe ---
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	server_tokens off;
	client_max_body_size 50m;

	# --- logi ---
	log_format main '$remote_addr - $remote_user [$time_local] '
		'"$request" $status $body_bytes_sent '
		'"$http_referer" "$http_user_agent"';
	access_log /dev/stdout main;

	# --- kompresja ---
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types
		application/geo+json
		application/json
		application/javascript
		application/octet-stream
		application/xml
		text/css
		text/javascript
		text/plain
		text/xml;

	# --- upstream ---
	upstream api_upstream {
		server api:8000 max_fails=3 fail_timeout=30s;
		keepalive 16;
	}

	upstream web_upstream {
		server web:80 max_fails=3 fail_timeout=30s;
		keepalive 16;
	}

	# --- cache dla PMTiles ---
	proxy_cache_path /tmp/nginx_cache levels=1:2
		keys_zone=pmtiles_cache:10m max_size=2g inactive=24h
		use_temp_path=off;

	# --- HTTP -> HTTPS (produkcja) ---
	server {
		listen 80;
		server_name _;
		return 301 https://$host$request_uri;
	}

	# --- HTTPS ---
	server {
		listen 443 ssl http2;
		server_name _;

		# certyfikaty (do podmontowania lub wygenerowania przez np. certbot)
		# ssl_certificate /etc/nginx/certs/fullchain.pem;
		# ssl_certificate_key /etc/nginx/certs/privkey.pem;

		# HSTS
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		# CORS
		add_header Access-Control-Allow-Origin "*" always;
		add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
		add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range" always;

		# --- API + PMTiles ---
		location /api/ {
			proxy_pass http://api_upstream;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Connection "";

			# WAŻNE dla PMTiles: bez buforowania, wsparcie Range
			proxy_request_buffering off;
			proxy_buffering off;
			proxy_read_timeout 60s;
		}

		# --- Healthcheck ---
		location /health {
			proxy_pass http://api_upstream;
			proxy_set_header Host $host;
		}

		# --- Frontend PWA ---
		location / {
			proxy_pass http://web_upstream;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header Connection "";

			# PWA assety — długi cache
			location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
				proxy_pass http://web_upstream;
				expires 1h;
				add_header Cache-Control "public, max-age=3600";
			}
		}
	}
}