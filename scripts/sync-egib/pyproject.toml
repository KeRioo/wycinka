[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egib-sync"
version = "0.1.0"
description = "ETL pipeline for EGiB (Polish land registry) data into PMTiles + SQLite"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "wycinka.app team" }]
keywords = ["egib", "gis", "pmtiles", "poland", "etl"]

dependencies = [
    "httpx>=0.27",
    "aiofiles>=24.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "shapely>=2.0",
    "pyproj>=3.7",
    "geopandas>=0.14",
    "fiona>=1.10",
    "tqdm>=4.66",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.103",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-aiofiles",
]

[project.scripts]
egib-sync = "egib_sync.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["egib_sync*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4",
    "DTZ", "T10", "RET", "SIM", "ARG", "PL",
]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "PLC0415",
    "PLR0912",
    "PLR0915",
    "S101",
    "N802",
    "DTZ005",
    "DTZ002",
    "SIM117",
    "S104",
    "S105",
    "S106",
    "S107",
    "S108",
    "S110",
    "S112",
    "B017",
    "C416",
    "RET504",
    "SIM102",
    "SIM105",
    "UP017",
    "UP035",
    "SLF001",
    "FBT003",
    "DTZ003",
    "DTZ011",
    "B008",
    "PERF401",
    "PERF203",
    "S608",
    "F401",
    "A001",
    "A002",
    "ARG001",
    "ARG002",
    "ARG005",
    "S311",
    "B904",
    "DTZ",
    "T201",
    "E731",
    "SIM108",
    "E501",
    "E741",
    "W293",
    "W291",
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "PLR0913", "PLR2004", "ARG", "FBT"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = []
exclude = ["data", "build", "dist"]

[[tool.mypy.overrides]]
module = ["geopandas", "fiona", "pandas", "pyogrio.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=egib_sync --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests (require real network/GIS)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:geopandas",
    "ignore::DeprecationWarning:fiona",
    "ignore::DeprecationWarning:shapely",
]